<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бесплатная диагностика ГИС за 2 минуты — АгроОтдел</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<style>
.qwrap{max-width:760px;margin:50px auto;padding:0 20px}
.qbar{height:6px;background:#e5e3dc;border-radius:999px;margin-bottom:26px}
.qbar i{display:block;height:100%;background:var(--yellow);border-radius:999px;transition:width .3s}
.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px}
.qcard h2{font-size:22px;margin-bottom:6px}
.qhint{color:var(--muted);font-size:14px;margin-bottom:22px}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;font-size:15px;background:#fbfaf7;transition:.15s;user-select:none}
.opt:hover{border-color:#b8b3a7;background:#fff}
.opt.sel{background:var(--green);color:#fff;border-color:var(--green)}
.opt b{display:block;font-size:15px}
.opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.opt.sel small{color:#b9cdc2}
.qbtns{display:flex;gap:12px;margin-top:24px}
.qcard input,.qcard textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#fbfaf7;margin-bottom:12px}
.qcard textarea{min-height:80px}
.qcard label{display:block;font-size:12.5px;font-weight:600;color:#47544d;margin-bottom:5px}

.r-block{background:#f9f9f7;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
.r-block h3{font-size:17px;margin-bottom:12px;color:var(--green)}
.sys-row{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px}
.sys-row .ic{flex-shrink:0}
.sys-row b{font-size:15px}
.sys-row small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.risk{background:#fff6e6;border:1px solid #f0d9a8;border-radius:12px;padding:16px;font-size:14px;margin-bottom:10px}
.risk b{color:#8a5b00}
.urg{display:inline-block;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700}
.urg.hot{background:#fdecec;color:#b3261e}
.urg.warm{background:#fff6e6;color:#8a5b00}
.urg.cold{background:#e8f4ec;color:#1b6e3c}
.r-note{color:var(--muted);font-size:12.5px;margin-top:18px}
</style>
</head>
<body>

<header class="header">
  <div class="container header-in">
    <a class="logo" href="index.html"><span class="logo-ic">🌾</span> АгроОтдел</a>
    <nav class="nav">
      <a href="index.html#services">Услуги</a>
      <a href="index.html#gis">ГИС</a>
      <a href="index.html#prices">Цены</a>
      <a href="index.html#faq">Вопросы</a>
    </nav>
    <a href="index.html" class="btn btn-secondary">← На главную</a>
  </div>
</header>

<main class="qwrap">
  <div class="qbar"><i id="prog" style="width:0%"></i></div>
  <div id="quiz" class="qcard"></div>
  <div id="result" style="display:none"></div>
</main>

<footer class="footer">
  <div class="container copy">© 2026 АгроОтдел · Информация не является публичной офертой</div>
</footer>

<script src="js/quiz.js"></script>
</body>
</html>
